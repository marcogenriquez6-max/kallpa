# Entorno completo de Kallpa: base de datos + API + sitio público.
#   cp .env.example .env   (y edite las claves)
#   docker compose up -d --build
#   docker compose exec api npx prisma db seed   (solo la primera vez)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kallpa
      POSTGRES_USER: kallpa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      TZ: America/La_Paz
    volumes:
      - kallpa_datos:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"   # solo accesible desde el propio servidor (5432/5433: ya usados por PostgreSQL locales)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kallpa -d kallpa"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kallpa:${DB_PASSWORD}@db:5432/kallpa
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-10h}
      SEED_PASSWORD: ${SEED_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      PORT: 3000
      TZ: America/La_Paz
    ports:
      - "3000:3000"

  # Sitio público (landing). Archivos estáticos de ./landing, sin build.
  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"

volumes:
  kallpa_datos:
