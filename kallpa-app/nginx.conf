# Configuración del sitio público (landing) para nginx:alpine.
# Se monta como /etc/nginx/conf.d/default.conf (ver docker-compose.yml).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para texto, CSS, JS, JSON y SVG.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript
               application/javascript application/json application/xml
               image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # El HTML no se cachea (debe revalidar), así los cambios se ven al instante.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Imágenes y fuentes: caché de un año (los nombres no cambian de contenido).
    location ~* \.(?:webp|png|jpe?g|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # API interna del sistema (login de trabajadores). El panel /sistema/
    # la consume en el mismo origen, así que no hay problemas de CORS.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
